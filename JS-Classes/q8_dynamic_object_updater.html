<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8: Dynamic Object Updater</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 25px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .user-details {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 25px;
      border-radius: 10px;
    }

    .user-details h2 {
      color: white;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      opacity: 0.9;
      font-size: 14px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 15px;
      border-radius: 20px;
    }

    .object-json {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border-left: 3px solid rgba(255, 255, 255, 0.5);
    }

    .update-notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      transform: translateX(400px);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .update-notification.show {
      transform: translateX(0);
    }

    @media (max-width: 600px) {
      .detail-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👤 Dynamic Object Updater</h1>

    <!-- Edit Form -->
    <div class="card">
      <h2>📝 Edit User Information</h2>
      <form id="editForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Enter age" min="1" max="120" required>
        </div>

        <button type="submit">Update User</button>
      </form>
    </div>

    <!-- User Details Display -->
    <div class="card user-details">
      <h2>📋 Current User Details</h2>
      
      <div class="detail-row">
        <span class="detail-label">Name:</span>
        <span class="detail-value" id="displayName">John</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Email:</span>
        <span class="detail-value" id="displayEmail">john@mail.com</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Age:</span>
        <span class="detail-value" id="displayAge">21</span>
      </div>

      <div class="object-json" id="objectJson"></div>
    </div>
  </div>

  <!-- Update Notification -->
  <div class="update-notification" id="updateNotification">
    ✅ User updated successfully!
  </div>

  <script>
    /**
     * Q8: Dynamic Object Updater
     * Allows editing object values through a form and displays updates in real-time
     */

    // User object
    let user = {
      name: "John",
      email: "john@mail.com",
      age: 21
    };

    // Get form elements
    const form = document.getElementById('editForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const ageInput = document.getElementById('age');

    // Get display elements
    const displayName = document.getElementById('displayName');
    const displayEmail = document.getElementById('displayEmail');
    const displayAge = document.getElementById('displayAge');
    const objectJson = document.getElementById('objectJson');
    const updateNotification = document.getElementById('updateNotification');

    // Function to update the display
    function updateDisplay() {
      // Update individual fields
      displayName.textContent = user.name;
      displayEmail.textContent = user.email;
      displayAge.textContent = user.age;

      // Update JSON representation
      objectJson.textContent = 'User Object:\n' + JSON.stringify(user, null, 2);
    }

    // Function to populate form with current user data
    function populateForm() {
      nameInput.value = user.name;
      emailInput.value = user.email;
      ageInput.value = user.age;
    }

    // Function to show notification
    function showNotification() {
      updateNotification.classList.add('show');
      setTimeout(() => {
        updateNotification.classList.remove('show');
      }, 2000);
    }

    // Form submission handler
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // Store old values for logging
      const oldUser = { ...user };

      // Update user object with form values
      user.name = nameInput.value.trim();
      user.email = emailInput.value.trim();
      user.age = parseInt(ageInput.value);

      // Update the display
      updateDisplay();

      // Show notification
      showNotification();

      // Log the changes
      console.log('=== User Updated ===');
      console.log('Previous:', oldUser);
      console.log('Current:', user);
      console.log('Changes:', {
        name: oldUser.name !== user.name,
        email: oldUser.email !== user.email,
        age: oldUser.age !== user.age
      });
    });

    // Add real-time preview on input (optional feature)
    const inputs = [nameInput, emailInput, ageInput];
    inputs.forEach(input => {
      input.addEventListener('input', () => {
        // Create temporary preview object
        const preview = {
          name: nameInput.value.trim() || user.name,
          email: emailInput.value.trim() || user.email,
          age: parseInt(ageInput.value) || user.age
        };
        
        // Log preview (without updating the actual object)
        console.log('Preview:', preview);
      });
    });

    // Initialize the page
    populateForm();
    updateDisplay();

    // Log initial user object
    console.log('Initial User Object:', user);
  </script>
</body>
</html>
