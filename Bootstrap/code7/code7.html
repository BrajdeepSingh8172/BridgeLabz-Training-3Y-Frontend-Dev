<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker with Badges</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="code7.css" />
</head>
<body class="bg-light">

  <!-- ===== Header ===== -->
  <header class="bg-success text-white text-center py-4">
    <h1 class="fw-bold mb-2">Task Tracker</h1>
    <p class="lead mb-0">Manage your daily goals efficiently</p>
  </header>

  <!-- ===== Main Section ===== -->
  <main class="container my-5">
    <!-- Header with Badge -->
    <div class="text-center mb-4">
      <h3 class="fw-bold">Pending Tasks
        <span class="badge bg-danger">5</span>
      </h3>
    </div>

    <!-- Task List -->
    <ul class="list-group mx-auto" style="max-width: 600px;">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Complete Bootstrap Assignment
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review Project Proposal
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Email Clients
        <span class="badge bg-success">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update Resume
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Prepare Presentation
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
    </ul>

    <!-- Completed Button -->
    <div class="text-center mt-5">
      <button class="btn btn-primary btn-lg">
        Completed <span class="badge bg-light text-dark">3</span>
      </button>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <small>&copy; 2025 Task Tracker | Stay Organized</small>
  </footer>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
