<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog - Bootstrap Grid System</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="code3.css" />
</head>
<body class="bg-light">

  <!-- ===== Header ===== -->
  <header class="bg-dark text-white text-center py-4 mb-4">
    <h1 class="fw-bold">ShopEase - Product Catalog</h1>
  </header>

  <!-- ===== Main Section ===== -->
  <main class="container">
    <div class="row g-4">
      <!-- Product Card 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card">
          <img src="https://picsum.photos/300/200?random=1" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="card-text text-muted">$49.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card">
          <img src="https://picsum.photos/300/200?random=2" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Smart Watch</h5>
            <p class="card-text text-muted">$79.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card">
          <img src="https://picsum.photos/300/200?random=3" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="card-text text-muted">$39.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Card 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 product-card">
          <img src="https://picsum.photos/300/200?random=4" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Gaming Mouse</h5>
            <p class="card-text text-muted">$24.99</p>
            <button class="btn btn-primary">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <small>&copy; 2025 ShopEase | All rights reserved</small>
  </footer>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
