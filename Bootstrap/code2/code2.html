<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio - Bootstrap Utilities</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="code2.css" />
</head>
<body class="bg-light text-dark">

  <!-- ===== Header ===== -->
  <header class="text-center p-5">
    <h1 class="fw-bold mb-3">Brajdeep Singh</h1>
    <p class="lead">Web Developer | Designer | Freelancer</p>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="container text-center">
    <!-- Profile Image -->
    <img
      src="https://picsum.photos/200"
      alt="Profile Image"
      class="img-fluid rounded-circle mb-4 shadow-sm"
      width="200"
      height="200"
    />

    <!-- Buttons -->
    <div class="mb-5">
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary">Download CV</a>
    </div>

    <!-- Contact Form -->
    <section class="mx-auto" style="max-width: 500px;">
      <h2 class="fw-bold mb-3">Contact Me</h2>
      <form>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" placeholder="Your Email" required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Send Message</button>
      </form>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="text-center mt-5 py-3 bg-dark text-white">
    <small>&copy; 2025 Brajdeep Singh | All Rights Reserved</small>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
