<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Landing Page</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="code1.css" />
</head>
<body>

  <!-- ===== Header & Navbar ===== -->
  <header class="bg-primary text-white">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="#">SkyTech Solutions</a>

      <!-- Responsive navbar toggle -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ===== Hero Section ===== -->
  <main class="py-5 bg-light">
    <div class="container">
      <!-- .row + .col to organize text and image side by side -->
      <div class="row align-items-center">
        <div class="col-md-6 text-center text-md-start">
          <h1 class="display-4 fw-bold mb-3">Innovate Your Digital Future</h1>
          <p class="lead mb-4">
            We help startups and businesses build modern, scalable web solutions
            with the latest technologies.
          </p>
          <a href="#" class="btn btn-primary btn-lg">Get Started</a>
        </div>

        <div class="col-md-6 text-center mt-4 mt-md-0">
          <!-- Responsive hero image -->
          <img
            src="https://picsum.photos/600/400"
            alt="Company Illustration"
            class="img-fluid rounded shadow-sm"
          />
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="bg-dark text-white text-center py-3">
    <small>&copy; 2025 SkyTech Solutions. All rights reserved.</small>
  </footer>

  <!-- Bootstrap JS Bundle (with Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
