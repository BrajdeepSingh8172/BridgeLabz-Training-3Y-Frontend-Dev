<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>3. Multi-Step Form</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="index.html" class="small">← Back to index</a>
  <h2>3. Multi-Step Form</h2>
  <div class="card">
    
<form id="multiStepForm" novalidate>
  <div id="step1" class="step">
    <label>Name</label>
    <input id="nameInput" required />
    <div><button type="button" id="next1">Next</button></div>
  </div>
  <div id="step2" class="step hidden">
    <label>Email</label>
    <input id="emailInput" type="email" required />
    <div><button type="button" id="back2">Back</button> <button type="button" id="next2">Next</button></div>
  </div>
  <div id="step3" class="step hidden">
    <label>Password</label>
    <input id="passwordInput" type="password" required minlength="6" />
    <div><button type="button" id="back3">Back</button> <button type="button" id="finish">Finish</button></div>
  </div>
</form>
<div id="summary" class="hidden card"></div>

  </div>
  <script src="js/q3.js"></script>
</body>
</html>
