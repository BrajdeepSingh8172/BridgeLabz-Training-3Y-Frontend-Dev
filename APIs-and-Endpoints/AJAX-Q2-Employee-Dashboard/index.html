<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Employee Status Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .server-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .server-info strong {
            color: #11998e;
        }

        .dashboard {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .dashboard-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .dashboard-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .dashboard-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #11998e;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .employees-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .employees-table thead th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #666;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .employee-row {
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .employee-row:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .employee-row td {
            padding: 20px 15px;
        }

        .employee-row td:first-child {
            border-radius: 8px 0 0 8px;
        }

        .employee-row td:last-child {
            border-radius: 0 8px 8px 0;
        }

        .employee-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .employee-position {
            color: #999;
            font-size: 0.9rem;
            margin-top: 3px;
        }

        .employee-email {
            color: #666;
            font-size: 0.9rem;
        }

        .department-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Toggle Switch Styles */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-label {
            font-weight: 600;
            min-width: 70px;
        }

        .status-active {
            color: #2ecc71;
        }

        .status-inactive {
            color: #e74c3c;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e74c3c;
            transition: .4s;
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #2ecc71;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }

        .toggle-slider.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading and Error States */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 60px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #11998e;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border: 1px solid #e74c3c;
            color: #c0392b;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #2ecc71;
            color: #27ae60;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-icon {
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .employees-table {
                font-size: 0.9rem;
            }

            .dashboard-stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👥 Employee Status Dashboard</h1>

        <div class="server-info">
            <strong>⚡ JSON Server Port:</strong> 3002 | 
            <strong>Endpoint:</strong> http://localhost:3002/employees
        </div>

        <div class="dashboard">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="dashboard-header">
                <h2>Employee Management</h2>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalEmployees">0</div>
                        <div class="stat-label">Total Employees</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="activeCount">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="inactiveCount">0</div>
                        <div class="stat-label">Inactive</div>
                    </div>
                </div>
            </div>

            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p>Loading employees...</p>
            </div>

            <table class="employees-table" id="employeesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <!-- Employees will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
