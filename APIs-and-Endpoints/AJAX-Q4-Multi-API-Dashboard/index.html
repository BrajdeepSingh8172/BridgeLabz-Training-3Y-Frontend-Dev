<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard | Fetch + Promise.all</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .server-info {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #856404;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert.warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .dashboard-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-icon {
            font-size: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #333;
        }

        .section-count {
            margin-left: auto;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Skeleton Loader */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 100px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        /* User Card */
        .user-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .user-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .user-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .user-badge {
            margin-left: auto;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        /* Order Card */
        .order-card {
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .order-card:hover {
            border-color: #50C878;
            box-shadow: 0 5px 15px rgba(80, 200, 120, 0.2);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-number {
            font-weight: bold;
            color: #333;
        }

        .order-status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-shipped {
            background: #cce5ff;
            color: #004085;
        }

        .order-details {
            color: #666;
            font-size: 0.9rem;
        }

        .order-amount {
            font-size: 1.2rem;
            color: #50C878;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Product Card */
        .product-card {
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: #F5A623;
            box-shadow: 0 5px 15px rgba(245, 166, 35, 0.2);
        }

        .product-header {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .product-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }

        .product-info h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .product-category {
            background: #f0f0f0;
            color: #666;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 5px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .product-price {
            font-size: 1.3rem;
            color: #F5A623;
            font-weight: bold;
        }

        .product-stock {
            color: #666;
            font-size: 0.9rem;
        }

        .product-rating {
            color: #FFD700;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Multi-API Dashboard</h1>
            <p class="subtitle">Loading multiple endpoints simultaneously with Fetch API + Promise.all</p>
            <div class="server-info">
                <strong>⚙️ Server Configuration:</strong> Make sure JSON Server is running on port <strong>3004</strong><br>
                Command: <code>json-server --watch db.json --port 3004</code>
            </div>
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh All Data</button>
        </header>

        <div id="alertContainer"></div>

        <div class="dashboard-grid">
            <!-- Users Section -->
            <div class="dashboard-section">
                <div class="section-header">
                    <span class="section-icon">👥</span>
                    <h2 class="section-title">Users</h2>
                    <span class="section-count" id="usersCount">0</span>
                </div>
                <div id="usersContainer">
                    <!-- Users will be loaded here -->
                </div>
            </div>

            <!-- Orders Section -->
            <div class="dashboard-section">
                <div class="section-header">
                    <span class="section-icon">📦</span>
                    <h2 class="section-title">Orders</h2>
                    <span class="section-count" id="ordersCount">0</span>
                </div>
                <div id="ordersContainer">
                    <!-- Orders will be loaded here -->
                </div>
            </div>

            <!-- Products Section -->
            <div class="dashboard-section">
                <div class="section-header">
                    <span class="section-icon">🛍️</span>
                    <h2 class="section-title">Products</h2>
                    <span class="section-count" id="productsCount">0</span>
                </div>
                <div id="productsContainer">
                    <!-- Products will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
